kind = "web"
previewPath = "/"
title = "ATTP School Inspection"
description = "Ứng dụng điều hành an toàn thực phẩm học đường cho UBND và Trạm Y tế Xã/Phường, hỗ trợ lập lịch kiểm tra, biên bản điện tử, checklist ATTP mở rộng, theo dõi khắc phục và cảnh báo SOP Alert."
version = "1.0.0"
id = "artifacts/attp-school-inspection"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20409

[services.development]
run = "pnpm --filter @workspace/attp-school-inspection run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/attp-school-inspection", "run", "build" ]
serve = "static"
publicDir = "artifacts/attp-school-inspection/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20409"
BASE_PATH = "/"
